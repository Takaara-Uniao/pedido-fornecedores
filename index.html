<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Pedido Fornecedores – Takaara</title>
<style>
  :root{--borda:#000;--azul:#1f3a8a;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#000;background:#eef0f3}
  /* ---------- Takaara Hortifruti Design System (tokens) ---------- */
  :root{
    --surface-app:#DEE9F4; --surface-card:#F4F7FB; --surface-sunken:#E7EEF7; --surface-hover:#E9F0F8; --surface-brand-soft:#EFF9F1;
    --border-subtle:#DEE7F1; --border-default:#CFDAE8; --border-strong:#B4C4D6;
    --green-600:#0E8F45; --green-700:#0A7238; --green-500:#169B4F; --red-500:#C4211C;
    --text-strong:#191C18; --text-body:#42473F; --text-muted:#7C827A; --text-brand:#0A7238;
    --ring-focus:0 0 0 2px #F4F7FB, 0 0 0 4px rgba(22,155,79,.55);
    --shadow-card:0 1px 2px rgba(23,37,60,.04); --shadow-xl:0 8px 16px rgba(23,37,60,.06),0 32px 64px -16px rgba(23,37,60,.22);
    --shadow-brand:0 6px 18px -6px rgba(14,143,69,.45);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  body{font-family:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--surface-app);color:var(--text-body)}
  button{font-family:inherit}
  /* ---------- login ---------- */
  #login{position:fixed;inset:0;background:var(--surface-app);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  #login form{background:var(--surface-card);padding:32px 28px;border-radius:20px;border:1px solid var(--border-subtle);box-shadow:var(--shadow-xl);width:min(380px,100%);text-align:left;animation:tkup .22s var(--ease)}
  #login img{width:170px;height:auto;display:block;margin:0 auto 18px}
  #login .eyebrow{text-align:center;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-brand);margin-bottom:6px}
  #login h1{text-align:center;font-size:28px;font-weight:500;line-height:1.18;margin:0 0 20px;color:var(--text-strong)}
  #login label{display:block;font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--text-strong);margin-bottom:6px}
  #login input{width:100%;height:48px;padding:0 14px;font:400 16px "Urbanist",sans-serif;color:var(--text-strong);background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px;margin-bottom:6px;outline:none;transition:box-shadow .14s var(--ease),border-color .14s}
  #login input:focus{border-color:var(--green-500);box-shadow:var(--ring-focus)}
  #login button{width:100%;height:48px;margin-top:10px;font:600 15px "Urbanist",sans-serif;border:0;border-radius:10px;background:var(--green-600);color:#fff;cursor:pointer;transition:background .14s var(--ease),transform .08s}
  #login button:hover{background:var(--green-700)} #login button:active{transform:scale(.98)}
  #login .err{color:var(--red-500);min-height:18px;font-size:13px;margin-bottom:4px}
  @keyframes tkup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* ---------- barra superior ---------- */
  #bar{position:sticky;top:0;z-index:10;background:var(--surface-card);border-bottom:1px solid var(--border-subtle);box-shadow:var(--shadow-card);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  #bar .marca{height:46px;width:auto;display:block;margin-right:4px}
  #bar button{font:500 13px "Urbanist",sans-serif;height:40px;padding:0 14px;border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-body);border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .14s var(--ease),border-color .14s,transform .08s}
  #bar button:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--text-strong)}
  #bar button:active{transform:scale(.98)}
  #bar button:focus-visible{outline:none;box-shadow:var(--ring-focus)}
  #bar svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #bar .pills{display:inline-flex;gap:6px;flex-wrap:wrap}
  #bar .pills button{border-radius:999px;border-color:transparent;background:transparent;font-weight:500;padding:0 16px}
  #bar .pills button:hover{background:var(--surface-hover);border-color:transparent}
  #bar .pills button.on{background:var(--green-600);color:#fff;font-weight:600;box-shadow:var(--shadow-brand)}
  #bar .pills button.on:hover{background:var(--green-700)}
  #bar .seg{display:inline-flex;background:var(--surface-sunken);border-radius:12px;padding:3px;gap:2px}
  #bar .seg button{height:34px;border:0;background:transparent;border-radius:9px}
  #bar .seg button:hover{background:var(--surface-hover)}
  #bar .seg button.on{background:var(--surface-card);color:var(--text-strong);font-weight:600;box-shadow:0 1px 2px rgba(23,37,60,.05),0 0 0 1px var(--border-subtle)}
  #bar .ic{width:40px;padding:0;justify-content:center}
  #bar .sp{flex:1}
  #bar button#bImp{background:var(--green-600);border-color:var(--green-600);color:#fff;font-weight:600}
  #bar button#bImp:hover{background:var(--green-700);border-color:var(--green-700)}
  #status{font-size:12px;color:var(--text-muted)}
  #semana{font-size:13px;font-weight:600;color:var(--text-strong);min-width:150px;text-align:center}
  #altBox{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
  #altBox b{color:var(--text-strong);min-width:40px;text-align:center;font-weight:600}
  #altBox button{height:32px;width:32px;padding:0;justify-content:center;font-size:16px}
  .folha:not(.larga){min-width:0}
  body.vend .folha{min-width:0;width:min(720px,100%)} body.vend table{width:100%!important;min-width:0!important}
  #wrap{padding:16px 24px 24px;overflow-x:auto}
  .folha{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;box-shadow:var(--shadow-card);padding:16px;min-width:1500px;animation:tkup .22s var(--ease)}
  .rodape{font-size:12px;color:var(--text-muted);margin:12px 4px;line-height:1.5}
  .rodape a{color:var(--text-brand);cursor:pointer;text-decoration:underline}
  @media (max-width:760px){
    #bar{padding:10px 12px} #bar button{height:44px} #bar .ic{width:44px} #wrap{padding:12px}
    #bar .seg button{height:38px} #altBox button{height:44px;width:44px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* ---------- tabela ---------- */
  table{border-collapse:collapse;table-layout:fixed;width:100%}
  td,th{border:1px solid var(--border-default);padding:0;height:var(--rh,22px);overflow:hidden;text-align:center;white-space:nowrap;font-size:10px}
  th{background:var(--green-600);color:#fff;font-weight:600;border-color:var(--green-700)}
  td.pn{text-align:left;font-weight:700;padding:0 4px;text-transform:uppercase;background:var(--surface-sunken);color:var(--text-strong)}
  tr.z td.pn{background:var(--surface-hover)}
  td.cm,td.qt{background:var(--surface-sunken);font-weight:700;color:var(--text-strong)}
  td.in{background:#fff;padding:0}
  td.in input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:10px "Urbanist",Arial,sans-serif;color:var(--text-strong);padding:0;outline:none;display:block}
  td.in input:focus{background:#EFF9F1;box-shadow:inset 0 0 0 2px rgba(22,155,79,.55)}
  td.tot{background:var(--green-700);color:#fff;font-weight:700;border-color:var(--green-700)}
  td.tt{background:var(--green-700);color:#fff;font-weight:700;font-size:13px;height:30px;border-color:var(--green-700)}
  th.nm{height:24px;padding:0}
  th.gr{height:18px;padding:0;background:var(--green-700)}
  th.gr select{width:100%;height:100%;border:0;background:transparent;color:#fff;font:600 9px "Urbanist",Arial,sans-serif;text-align-last:center;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none}
  th.gr select option{color:#191C18}
  th.gr.fora{background:#8F5A00}
  th.nm input{width:100%;height:100%;border:0;background:transparent;color:#fff;text-align:center;font:700 10px "Urbanist",Arial,sans-serif;text-transform:uppercase;outline:none;padding:0}
  th.nm input::placeholder{color:rgba(255,255,255,.55);font-weight:400}
  th.nm input:focus{background:rgba(255,255,255,.18)}
  td.leg{background:var(--surface-sunken);color:var(--text-muted);font-size:9px;white-space:normal;text-align:left;padding:4px 8px;height:auto}
  .stit{background:var(--green-700);color:#fff;font-weight:700;font-size:13px;height:32px;border-color:var(--green-700)}
  /* ---------- cartazes ---------- */
  .cz{display:grid;gap:8px;align-items:start}
  .cz.pedra{grid-template-columns:repeat(7,1fr)} .cz.fora{grid-template-columns:repeat(4,1fr)}
  .cz .bl{border:1.5px solid var(--text-strong);background:#fff}
  .cz .bl .h{background:var(--green-700);color:#fff;font-weight:700;text-align:center;padding:6px 2px;font-size:14px;text-transform:uppercase}
  .cz .bl .i{font-size:15px;font-weight:700;padding:8px 6px;border-top:1px solid var(--border-default);text-transform:uppercase;color:var(--text-strong);line-height:1.15}
  .czt{font-size:22px;font-weight:700;text-align:center;color:var(--text-strong);margin:0 0 12px;letter-spacing:.03em}
  .czv{padding:40px;text-align:center;color:var(--text-muted);font-size:14px}
  body.vend .folha{min-width:0;width:min(720px,100%)}
  .folha.larga{min-width:2300px}
  /* ---------- impressão ---------- */
  @page{size:A4 landscape;margin:5mm}
  @media print{
    body{background:#fff}
    #bar,#login,.rodape,.no-print{display:none!important}
    #wrap{padding:0;overflow:visible}
    .folha,.folha.larga{padding:0;width:100%;min-width:0;background:none;border:0;border-radius:0;box-shadow:none;animation:none}
    html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    td.in input::placeholder,th.nm input::placeholder{color:transparent}
    td.in input:focus{background:transparent;box-shadow:none}
    table.pf td,table.pf th{font-size:6.2px;height:2.95mm!important}
    table.pf td.in input{font-size:6.2px}
    table.pf th.nm{height:3.6mm!important} table.pf th.gr{height:2.8mm!important}
    table.pf th.gr select{font-size:5.5px}
    table.pf th.nm input{font-size:6.2px}
    table.pf tr.z{break-inside:avoid}
    .stit{height:6mm!important;font-size:10px}
    table.pf td.tt{height:5mm!important;font-size:8px}
    table.pf td.leg{display:none}
    .czt{font-size:20px}
    .cz .bl{break-inside:avoid}
  }
</style>
<style id="pgst"></style>
</head>

function segundaAlvo(hoje){
  const d = new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  const w = d.getDay();
  if (w===5) d.setDate(d.getDate()+3);
  else if (w===6) d.setDate(d.getDate()+2);
  else if (w===0) d.setDate(d.getDate()+1);
  else d.setDate(d.getDate()-(w-1));
  return d;
}

  const h=new Date(), w=h.getDay(), s=segundaAlvo(h);

  const dia = iso(dataDia(diaSel));

  if (!online() || document.hidden || !ROLE) return;

  $("#folha").classList.toggle("larga", staff && aba==="pedido");
  $("#altBox").style.display = aba==="pedido" ? "" : "none";
  $("#dica").textContent = aba==="pedido"
    ? (staff ? "Preencha QTDE e PREÇO de cada coluna. Custo médio, Qtd total e Total geral calculam sozinhos. O nome de cada coluna e o destino (Pedra ou Fora) podem ser trocados em cada dia."
             : "Preencha a QTDE e o PREÇO dos seus produtos. O total calcula sozinho e tudo salva sozinho.")
    : "Os cartazes são montados sozinhos a partir do que foi preenchido no Pedido Fornecedores.";
  document.querySelectorAll(".dia").forEach((b,i)=>{ const d=dataDia(i); b.textContent = DIAS[i]+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1); b.classList.toggle("on",i===diaSel); });
  const a=dataDia(0), z=dataDia(2);
  $("#semana").textContent = "Semana "+pad(a.getDate())+"/"+pad(a.getMonth()+1)+" a "+pad(z.getDate())+"/"+pad(z.getMonth()+1);
  if (aba==="pedido") desenharPedido(); else desenharCartaz();
}
function desenharPedido(){
  const dt = dataDia(diaSel), vend = ehVend();
  let h="";
  if (vend){
    const c=ROLE.col, nm = nomeCol(c) || ROLE.nome;
    h+='<table class="pf"><colgroup><col style="width:46%"><col style="width:16%"><col style="width:18%"><col style="width:20%"></colgroup>';
    h+=`<tr><td colspan="4" class="stit">${br(dt)} — ${esc(nm)} — PEDIDO FORNECEDORES</td></tr>`;
    h+='<tr><th>PRODUTO</th><th>QTDE</th><th>PREÇO (R$)</th><th>TOTAL (R$)</th></tr>';
    PRODS.forEach((p,r)=>{
      h+=`<tr class="${r%2?"":"z"}"><td class="pn">${esc(p)}</td><td class="in"><input inputmode="decimal" data-id="q${r}_${c}" autocomplete="off"></td><td class="in"><input inputmode="decimal" data-id="p${r}_${c}" autocomplete="off"></td><td class="cm" id="v${r}"></td></tr>`;
    });
    h+=`<tr><td class="tot">TOTAL</td><td class="tot" id="TQ"></td><td class="tot"></td><td class="tot" id="TV"></td></tr></table>`;
  } else {
    h+='<table class="pf"><colgroup><col style="width:10.5%"><col style="width:3.2%"><col style="width:3%">'+'<col style="width:2.6%"><col style="width:2.1%">'.repeat(NC)+'</colgroup>';
    h+=`<tr><td colspan="${3+NC*2}" class="stit">${br(dt)} &nbsp;—&nbsp; UNIÃO DISTRIBUIDORA | TAKAARA &nbsp;—&nbsp; PEDIDO DE COMPRAS POR FORNECEDOR</td></tr>`;
    h+='<tr><th rowspan="3">PRODUTO</th><th rowspan="3">CUSTO<br>MÉDIO (R$)</th><th rowspan="3">QTD<br>TOTAL</th>';
    for(let c=0;c<NC;c++) h+=`<th class="nm" colspan="2"><input data-id="n${c}" placeholder="Coluna ${c+1}" autocomplete="off"></th>`;
    h+='</tr><tr>';
    for(let c=0;c<NC;c++) h+=`<th class="gr" colspan="2" id="gr${c}"><select data-id="g${c}" title="Para qual cartaz vão os pedidos desta coluna"><option value="pedra">Pedra</option><option value="fora">Fora</option></select></th>`;
    h+='</tr><tr>'+'<th>QTDE</th><th>PREÇO</th>'.repeat(NC)+'</tr>';
    PRODS.forEach((p,r)=>{
      h+=`<tr class="${r%2?"":"z"}"><td class="pn">${esc(p)}</td><td class="cm" id="cm${r}"></td><td class="qt" id="qt${r}"></td>`;
      for(let c=0;c<NC;c++) h+=`<td class="in"><input inputmode="decimal" data-id="q${r}_${c}" autocomplete="off"></td><td class="in"><input inputmode="decimal" data-id="p${r}_${c}" autocomplete="off"></td>`;
      h+='</tr>';
    });
    h+='<tr><td class="tot">TOTAL GERAL</td><td class="tot" id="TGV"></td><td class="tot" id="TGQ"></td>';
    for(let c=0;c<NC;c++) h+=`<td class="tot" id="Tq${c}"></td><td class="tot" id="Tv${c}"></td>`;
    h+='</tr>';
    h+=`<tr><td colspan="${3+NC*2}" class="leg">LEGENDA: Em cada fornecedor, QTDE = quantidade e PREÇO = valor unitário. CUSTO MÉDIO = média ponderada de todos. TOTAL GERAL: no QTDE a soma das quantidades da coluna; no PREÇO o valor total da coluna (QTDE × PREÇO); no CUSTO MÉDIO o valor total geral.</td></tr>`;
    h+='</table>';
  }
  $("#conteudo").innerHTML = h;
  document.querySelectorAll("[data-id]").forEach(el=>{
    const id=el.dataset.id;
    if (el.tagName==="SELECT") el.value = grupoCol(+id.slice(1));
    else if (id[0]==="n") el.value = nomeCol(+id.slice(1));
    else el.value = dados[id] ?? "";
  });
  recalcular();
}
function recalcular(){
  const f=(n,c=2)=>fmt(n,c), fq=n=>fmt(n,n%1?2:0);
  if (ehVend()){
    const c=ROLE.col; let tq=0,tv=0;
    PRODS.forEach((_,r)=>{ const q=num(dados["q"+r+"_"+c]), p=num(dados["p"+r+"_"+c]); tq+=q; tv+=q*p; const e=$("#v"+r); if(e) e.textContent = q&&p ? f(q*p) : ""; });
    $("#TQ").textContent = tq?fq(tq):""; $("#TV").textContent = tv?f(tv):""; return;
  }
  const Tq=Array(NC).fill(0), Tv=Array(NC).fill(0); let GQ=0,GV=0;
  PRODS.forEach((_,r)=>{
    let q=0,v=0;
    for(let c=0;c<NC;c++){ const a=num(dados["q"+r+"_"+c]), p=num(dados["p"+r+"_"+c]); q+=a; v+=a*p; Tq[c]+=a; Tv[c]+=a*p; }
    GQ+=q; GV+=v;
    $("#qt"+r).textContent = q?fq(q):""; $("#cm"+r).textContent = q?f(v/q):"";
  });
  for(let c=0;c<NC;c++){ $("#Tq"+c).textContent=Tq[c]?fq(Tq[c]):""; $("#Tv"+c).textContent=Tv[c]?f(Tv[c]):""; const g=$("#gr"+c); if(g) g.classList.toggle("fora",grupoCol(c)==="fora"); }
  $("#TGQ").textContent = GQ?fq(GQ):""; $("#TGV").textContent = GV?f(GV):"";
}
/* ---------- cartazes ---------- */
function blocos(grupo){
  const out=[];
  for(let c=0;c<NC;c++){
    if (grupoCol(c)!==grupo) continue;
    const it=[];
    PRODS.forEach((p,r)=>{ const q=num(dados["q"+r+"_"+c]); if(q>0) it.push(fmt(q,q%1?2:0)+" "+p); });
    if (it.length) out.push({nome:nomeCol(c)||("Coluna "+(c+1)),it});
  }
  return out;
}
function pintarCz(){
  const grupo = aba==="fora" ? "fora" : "pedra", dt=dataDia(diaSel);
  const bl = blocos(grupo);
  const tit = grupo==="fora" ? "COMPRA FORA — DIA "+br(dt) : "RECEBIMENTO FORNECEDORES — "+br(dt);
  let h=`<div class="czt">${tit}</div>`;
  if (!bl.length) h+='<div class="czv">Nenhum pedido lançado para este dia.</div>';
  else h+=`<div class="cz ${grupo}">`+bl.map(b=>`<div class="bl"><div class="h">${esc(b.nome)}</div>`+b.it.map(i=>`<div class="i">${esc(i)}</div>`).join("")+'</div>').join("")+'</div>';
  $("#czArea").innerHTML=h;
}
function desenharCartaz(){
  if (ehVend()) { aba="pedido"; return desenhar(); }
  $("#conteudo").innerHTML=`<div id="czArea"></div>`;
  pintarCz();
}

/* ---------- eventos ---------- */
function aoEditar(el){
  const id=el.dataset.id, v=el.value;
  const padrao = id[0]==="g" ? GRUPO_PADRAO[+id.slice(1)] : "";
  if (v==="" || (id[0]==="g" && v===padrao)) delete dados[id]; else dados[id]=v;
  recalcular(); salvar(id, id[0]==="g" && v===padrao ? "" : v);
}
document.addEventListener("input",e=>{ const el=e.target; if (el.dataset && el.dataset.id && el.tagName==="INPUT") aoEditar(el); });
document.addEventListener("change",e=>{ const el=e.target; if (el.dataset && el.dataset.id && el.tagName==="SELECT") aoEditar(el); });
const NAV='input[data-id^="q"],input[data-id^="p"]';
document.addEventListener("keydown",e=>{
  const k=e.key, el=e.target;
  if (!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k) || !el.matches || !el.matches(NAV)) return;
  const tr=el.closest("tr"); if (!tr) return;
  const rows=[...document.querySelectorAll("#conteudo tr")].filter(r=>r.querySelector(NAV));
  const ri=rows.indexOf(tr); if (ri<0) return;
  const ins=[...tr.querySelectorAll(NAV)], ci=ins.indexOf(el);
  let t=null;
  if (k==="ArrowUp") t=rows[ri-1] && rows[ri-1].querySelectorAll(NAV)[ci];
  else if (k==="ArrowDown") t=rows[ri+1] && rows[ri+1].querySelectorAll(NAV)[ci];
  else if (k==="ArrowLeft") t=ins[ci-1];
  else if (k==="ArrowRight") t=ins[ci+1];
  if (t){ e.preventDefault(); t.focus(); t.select&&t.select(); }
});
document.addEventListener("keydown",e=>{
  if (e.key!=="Enter" || !e.target.matches || !e.target.matches(NAV)) return;
  e.preventDefault();
  const m=e.target.dataset.id.match(/^([qp])(\d+)_(\d+)$/);
  const nxt=m && document.querySelector(`[data-id="${m[1]}${+m[2]+1}_${m[3]}"]`);
  (nxt||document.querySelectorAll(NAV)[[...document.querySelectorAll(NAV)].indexOf(e.target)+1])?.focus();
});
document.querySelectorAll(".aba").forEach(b=>b.addEventListener("click",()=>{ aba=b.dataset.a; desenhar(); }));
document.querySelectorAll(".dia").forEach(b=>b.addEventListener("click",()=>{ diaSel=+b.dataset.d; carregar(); }));
$("#bPrev").onclick=()=>{ segunda.setDate(segunda.getDate()-7); carregar(); };
$("#bNext").onclick=()=>{ segunda.setDate(segunda.getDate()+7); carregar(); };
$("#bHoje").onclick=()=>{ segunda=segundaAlvo(new Date()); diaSel=diaInicial(); carregar(); };
$("#bImp").onclick=()=>window.print();
function mudaAlt(d){ ALT.pedido=Math.max(14,Math.min(70,ALT.pedido+d)); try{localStorage.setItem("pf_alturas",JSON.stringify(ALT))}catch(e){} aplicarAltura(); }
$("#bAltM").onclick=()=>mudaAlt(-2); $("#bAltP").onclick=()=>mudaAlt(2);
$("#lnkSenha").onclick=async()=>{
  const s=prompt("Digite a nova senha:"); if(!s) return;
  const h=await sha(s); prompt("Copie este código e cole no arquivo, no campo \"h\" do usuário desejado (lista USUARIOS):",h);
};
setInterval(atualizar,10000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) atualizar(); });

/* ---------- senha ---------- */
async function sha(t){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function abrir(){
  $("#login").style.display="none"; $("#app").hidden=false;
  $("#spSenha").style.display = ROLE.tipo==="admin" ? "" : "none";
  document.body.classList.toggle("vend", ROLE.tipo==="vend");
  if (ROLE.tipo==="vend") document.querySelectorAll(".aba.staff").forEach(b=>b.style.display="none");
  diaSel=diaInicial(); carregar();
}
$("#fLogin").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const h=await sha($("#senha").value);
    const u=USUARIOS.find(x=>x.h===h);
    if (u){ ROLE=u; try{sessionStorage.setItem("pf_ok",h)}catch(_){} abrir(); }
    else { $("#err").textContent="Senha incorreta"; $("#senha").value=""; }
  }catch(err){ $("#err").textContent="Abra o link com https:// (endereço seguro)"; }
});
try{ const hh=sessionStorage.getItem("pf_ok"), u=USUARIOS.find(x=>x.h===hh); if (u){ ROLE=u; abrir(); } }catch(e){}
</script>
